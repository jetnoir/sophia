[package]
name = "sophia"
version = "0.1.0"
edition = "2021"
authors = ["Stuart Thomas"]
description = "A modern, blazingly fast TUI ping tool for macOS."
license-file = "LICENSE"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
surge-ping = "0.8"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
chrono = "0.4"
dns-lookup = "2.0"
unicode-width = "0.1"
